<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110">
<defs>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4e38"/><stop offset="1" stop-color="#3e281e"/></linearGradient>
<linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="1190" y2="0"><stop offset="0" stop-color="#ff9a3c"/><stop offset=".5" stop-color="#8f6bd8"/><stop offset="1" stop-color="#8f6bd8" stop-opacity="0"/></linearGradient>
</defs>
<style>
.sw{transform-origin:180.0px 0;animation:sw 4s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.l{stroke-dasharray:800;stroke-dashoffset:800;animation:d 1.8s ease-out .3s forwards}@keyframes d{to{stroke-dashoffset:0}}
.s{opacity:0;animation:f 1s ease-out 1s forwards}@keyframes f{to{opacity:1}}
</style>
<g class="sw">
<path d="M70 0L70 34M290 0L290 34" stroke="#b08a5a" stroke-width="3" stroke-dasharray="5 3"/>
<rect x="30" y="30" width="300" height="66" rx="9" fill="url(#wood)" stroke="#24160f" stroke-width="2"/>
<path d="M44 48q100.0 -6 180.0 2M50 80q150.0 6 250 -3" stroke="#24160f" stroke-opacity=".45" stroke-width="2" fill="none"/>
<circle cx="70" cy="38" r="3" fill="#cfb38a"/><circle cx="290" cy="38" r="3" fill="#cfb38a"/>
<text x="180.0" y="74" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#1a0f0a" opacity=".6" transform="translate(1.5 2)"><tspan fill="#9fd38a">♣</tspan> Paths Out</text>
<text x="180.0" y="74" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#f3ead2"><tspan fill="#9fd38a">♣</tspan> Paths Out</text>
</g>
<text x="360" y="58" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#9a8bd0" class="s">follow the lanterns, if you can find them</text>
<path d="M360 76H1190" stroke="url(#ln)" stroke-width="2" class="l"/>
</svg>
