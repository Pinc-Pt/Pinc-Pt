<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140d1c"/><stop offset="1" stop-color="#241628"/></linearGradient>
<linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2e24"/><stop offset="1" stop-color="#22140f"/></linearGradient>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a22"/><stop offset="1" stop-color="#2a2550"/></linearGradient>
<radialGradient id="warm"><stop offset="0" stop-color="#ffb347" stop-opacity=".45"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<radialGradient id="frost"><stop offset=".55" stop-color="#e8f1ff" stop-opacity="0"/><stop offset="1" stop-color="#e8f1ff" stop-opacity=".3"/></radialGradient>
<pattern id="planks" width="90" height="400" patternUnits="userSpaceOnUse"><path d="M0 0V400" stroke="#0c0710" stroke-width="3"/><path d="M45 60v4M20 230v5M70 330v4" stroke="#0c0710" stroke-width="2"/></pattern>
<pattern id="snow" width="120" height="120" patternUnits="userSpaceOnUse"><circle cx="10" cy="14" r="1.8" fill="#fff"/><circle cx="52" cy="40" r="1.3" fill="#fff"/><circle cx="96" cy="8" r="2.2" fill="#fff"/><circle cx="30" cy="78" r="1.5" fill="#fff"/><circle cx="80" cy="96" r="1.9" fill="#fff"/><circle cx="112" cy="62" r="1.2" fill="#fff"/></pattern>
<clipPath id="win"><rect x="70" y="50" width="230" height="200" rx="4"/></clipPath>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feFlood flood-color="#ff9a3c" flood-opacity=".6"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.fall{animation:fall 6s linear infinite}@keyframes fall{from{transform:translate(0,-120px)}to{transform:translate(-20px,0)}}
.fl{transform-origin:1080px 196px;animation:fl 1s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.15) rotate(4deg)}}
.halo{animation:h 2.4s ease-in-out infinite alternate}@keyframes h{from{opacity:.6}to{opacity:1}}
.wish{animation:w 3s ease-in-out infinite}@keyframes w{50%{transform:translateY(-10px)}}
.tw{transform-origin:905px 288px;animation:tw 2s ease-in-out infinite}@keyframes tw{50%{transform:rotate(45deg) scale(.6);opacity:.5}}
.hand{transform-origin:600px 470px;animation:hd 5s ease-in-out infinite}@keyframes hd{50%{transform:rotate(3deg)}}
.in{opacity:0;animation:in 1.4s ease-out .2s forwards}@keyframes in{to{opacity:1}}
.type{transform:scaleX(0);transform-origin:0 0;animation:ty 2.8s steps(50) 1.2s forwards}@keyframes ty{to{transform:scaleX(1)}}
</style>
<rect width="1200" height="400" fill="url(#wall)"/>
<rect width="1200" height="400" fill="url(#planks)"/>
<g clip-path="url(#win)">
<rect x="70" y="50" width="230" height="200" fill="url(#night)"/>
<circle cx="250" cy="95" r="22" fill="#f3ead2"/>
<path d="M95 170 l26 80 h-52 z" fill="#141029"/><path d="M140 150 l32 100 h-64 z" fill="#141029"/><path d="M190 175 l24 75 h-48 z" fill="#141029"/><path d="M235 160 l30 90 h-60 z" fill="#141029"/><path d="M275 180 l22 70 h-44 z" fill="#141029"/>
<rect x="70" y="232" width="230" height="20" fill="#dfe8f5"/>
<g class="fall"><rect x="40" y="-80" width="300" height="360" fill="url(#snow)"/></g>
<rect x="70" y="50" width="230" height="200" fill="url(#frost)"/>
</g>
<rect x="70" y="50" width="230" height="200" rx="4" fill="none" stroke="#3a2620" stroke-width="12"/>
<path d="M185 50v200M70 150h230" stroke="#3a2620" stroke-width="8"/>
<rect x="58" y="248" width="254" height="12" rx="3" fill="#4a2e24"/>
<circle cx="1080" cy="200" r="110" fill="url(#warm)" class="halo"/>
<rect x="1030" y="262" width="100" height="10" rx="3" fill="#4a2e24"/>
<rect x="1066" y="206" width="28" height="58" rx="4" fill="#f3ead2"/>
<path d="M1066 214q6 10 0 18M1094 210q-5 8 0 16" stroke="#e2d6b6" stroke-width="4" fill="none"/>
<path d="M1080 206v-7" stroke="#2c2142" stroke-width="2"/>
<g class="fl"><path d="M1080 166q14 18 0 34q-14-16 0-34z" fill="#ff9a3c"/><path d="M1080 180q6 10 0 18q-6-8 0-18z" fill="#ffe08a"/></g>
<rect x="0" y="330" width="1200" height="70" fill="url(#table)"/>
<path d="M0 330H1200" stroke="#6b4434" stroke-width="3"/>
<g transform="translate(380 352)"><ellipse cx="-12" cy="0" rx="14" ry="16" fill="#d9661f"/><ellipse cx="12" cy="0" rx="14" ry="16" fill="#d9661f"/><ellipse cx="0" cy="0" rx="15" ry="17" fill="#f07a26"/><rect x="-2" y="-22" width="4" height="7" rx="1.5" fill="#4b6b2f"/><g fill="#ffd27a" class="halo"><path d="M-12-4l5-6l5 6zM2-4l5-6l5 6zM-12 5q12 9 24 0l-4 3l-4-3l-4 3l-4-3l-4 3z"/></g></g>
<g class="hand"><g transform="rotate(-24 600 470)"><rect x="572" y="292" width="56" height="80" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><text x="578" y="309" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#2c2142">A</text><text x="600" y="342" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#2c2142">♠</text></g><g transform="rotate(-12 600 470)"><rect x="572" y="292" width="56" height="80" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><text x="578" y="309" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#c0392b">K</text><text x="600" y="342" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#c0392b">♥</text></g><g transform="rotate(0 600 470)"><rect x="572" y="292" width="56" height="80" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><text x="578" y="309" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#2c2142">Q</text><text x="600" y="342" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#2c2142">♣</text></g><g transform="rotate(12 600 470)"><rect x="572" y="292" width="56" height="80" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><text x="578" y="309" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#c0392b">J</text><text x="600" y="342" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#c0392b">♦</text></g><g transform="rotate(24 600 470)"><rect x="572" y="292" width="56" height="80" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><text x="578" y="309" font-family="Georgia,'Times New Roman',serif" font-size="13" font-weight="700" fill="#2c2142">7</text><text x="600" y="342" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="26" fill="#2c2142">♠</text></g></g>
<g transform="translate(735 352) rotate(-14)"><rect x="-16" y="-16" width="32" height="32" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><circle cx="-7" cy="-7" r="2.6" fill="#2c2142"/><circle cx="7" cy="-7" r="2.6" fill="#2c2142"/><circle cx="0" cy="0" r="2.6" fill="#2c2142"/><circle cx="-7" cy="7" r="2.6" fill="#2c2142"/><circle cx="7" cy="7" r="2.6" fill="#2c2142"/></g><g transform="translate(778 360) rotate(10)"><rect x="-16" y="-16" width="32" height="32" rx="6" fill="#f3ead2" stroke="#2c2142" stroke-width="1.5"/><circle cx="-7" cy="-7" r="2.6" fill="#2c2142"/><circle cx="0" cy="0" r="2.6" fill="#2c2142"/><circle cx="7" cy="7" r="2.6" fill="#2c2142"/></g>
<g class="wish"><circle cx="905" cy="288" r="34" fill="url(#warm)"/><path class="tw" d="M905 270l5 13l13 5l-13 5l-5 13l-5-13l-13-5l13-5z" fill="#ffe08a"/></g>
<text x="905" y="322" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="14" fill="#ffe08a" fill-opacity=".8">the wish</text>
<g class="in"><text x="640" y="150" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="96" font-weight="700" letter-spacing="14" fill="#f3ead2" filter="url(#glow)">PINC</text></g>
<clipPath id="tc"><rect x="0" y="170" width="1200" height="44" class="type"/></clipPath>
<g clip-path="url(#tc)"><text x="640" y="202" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="25" fill="#efe2ff">aspen moor fictkin · one game, one wish</text></g>
<text x="640" y="238" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="5" fill="#ff9a3c" fill-opacity=".85">COME IN FROM THE COLD · IT'S SPOOKY MONTH</text>
</svg>
