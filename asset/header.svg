<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06120b"/><stop offset="1" stop-color="#103322"/>
    </linearGradient>
    <linearGradient id="tileg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d45"/><stop offset="1" stop-color="#0f3d1f"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fe3a0" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <style>
    .smoke { animation: rise linear infinite; }
    @keyframes rise { 0% { transform: translateY(0); opacity:0 } 20% { opacity:.18 } 100% { transform: translateY(-520px); opacity:0 } }
    .tile { opacity:0; animation: drop .7s ease-out forwards; }
    @keyframes drop { from { opacity:0; transform: translateY(-30px) } to { opacity:1 } }
    .spark { animation: twinkle 3s ease-in-out infinite; opacity:.2 }
    @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
    .type { transform: scaleX(0); transform-origin: 0 0; animation: type 3.2s steps(60) 1.4s forwards; }
    @keyframes type { to { transform: scaleX(1) } }
    .caret { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity:0 } }
  </style>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
