<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120c1a"/><stop offset="1" stop-color="#22162a"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e4c6"/><stop offset=".6" stop-color="#e6d3ab"/><stop offset="1" stop-color="#d4bb8a"/></linearGradient>
<radialGradient id="burn" cx=".5" cy=".5" r=".7"><stop offset=".6" stop-color="#5a3418" stop-opacity="0"/><stop offset="1" stop-color="#5a3418" stop-opacity=".55"/></radialGradient>
<radialGradient id="warm" cx=".85" cy=".2" r=".6"><stop offset="0" stop-color="#ffb347" stop-opacity=".25"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
<linearGradient id="odds" x1="0" x2="1"><stop offset="0" stop-color="#5b3f7a"/><stop offset="1" stop-color="#a8322a"/></linearGradient>
<clipPath id="sig"><rect x="850" y="330" width="260" height="80" class="w"/></clipPath>
</defs>
<style>
.r{opacity:0;animation:f .6s ease-out forwards}@keyframes f{to{opacity:1}}
.bar{transform:scaleX(0);transform-origin:350px 0;animation:b 2.2s ease-out 1.6s forwards}@keyframes b{to{transform:scaleX(.99)}}
.w{transform:scaleX(0);transform-origin:850px 0;animation:wr 1.6s ease-in-out 2.6s forwards}@keyframes wr{to{transform:scaleX(1)}}
.seal{opacity:0;transform-origin:970px 175px;animation:s .4s ease-out 3.6s forwards}@keyframes s{from{opacity:0;transform:scale(1.8) rotate(-30deg)}to{opacity:1;transform:scale(1) rotate(-8deg)}}
.glow{animation:g 2.6s ease-in-out infinite alternate}@keyframes g{from{opacity:.5}to{opacity:1}}
</style>
<rect width="1200" height="480" fill="url(#bg)"/>
<path d="M44 34 L380 28 L700 36 L1156 30 L1162 240 L1154 448 L760 454 L420 446 L40 452 L46 240Z" fill="url(#paper)"/>
<path d="M44 34 L380 28 L700 36 L1156 30 L1162 240 L1154 448 L760 454 L420 446 L40 452 L46 240Z" fill="url(#burn)"/>
<path d="M44 34 L380 28 L700 36 L1156 30 L1162 240 L1154 448 L760 454 L420 446 L40 452 L46 240Z" fill="url(#warm)" class="glow"/>
<rect x="70" y="56" width="1060" height="370" rx="4" fill="none" stroke="#3a2218" stroke-opacity=".35" stroke-width="1.5"/>
<rect x="76" y="62" width="1048" height="358" rx="3" fill="none" stroke="#3a2218" stroke-opacity=".2"/>
<text x="600" y="100" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="34" font-weight="700" fill="#3a2218">♠ The Wager ♦</text>
<text x="600" y="124" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="14" fill="#8a5a36">an agreement between host and guest, signed by candlelight</text>
<g class="r" style="animation-delay:0.30s"><text x="100" y="166" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">PLAYER</text><text x="350" y="166" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">Pinc-Pt</text><path d="M100 177H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g><g class="r" style="animation-delay:0.45s"><text x="100" y="199" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">ALIAS</text><text x="350" y="199" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">PιɳC (formerly Pinc **********)</text><path d="M100 210H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g><g class="r" style="animation-delay:0.60s"><text x="100" y="232" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">HOST</text><text x="350" y="232" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">Aspen Moor, by way of fictkin</text><path d="M100 243H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g><g class="r" style="animation-delay:0.75s"><text x="100" y="265" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">GAME OF CHOICE</text><text x="350" y="265" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">cards, board games, stranger games</text><path d="M100 276H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g><g class="r" style="animation-delay:0.90s"><text x="100" y="298" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">STAKES</text><text x="350" y="298" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">one wish, granted to the winner</text><path d="M100 309H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g><g class="r" style="animation-delay:1.05s"><text x="100" y="331" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">TIME ZONE</text><text x="350" y="331" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">UTC+03:00, the woods don't care</text><path d="M100 342H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g><g class="r" style="animation-delay:1.20s"><text x="100" y="364" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">CURRENTLY PLAYING</text><text x="350" y="364" font-family="Georgia,'Times New Roman',serif" font-size="20" fill="#3a2218">this profile (coding is hard)</text><path d="M100 375H800" stroke="#3a2218" stroke-opacity=".15" stroke-dasharray="2 4"/></g>
<text x="100" y="410" font-family="Consolas,Menlo,monospace" font-size="13" letter-spacing="2" fill="#8a5a36">ODDS</text>
<rect x="350" y="395" width="330" height="18" rx="9" fill="none" stroke="#3a2218" stroke-opacity=".4"/>
<rect x="350" y="395" width="330" height="18" rx="9" fill="url(#odds)" class="bar"/>
<text x="692" y="409" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="15" fill="#a8322a">the house wins</text>
<path d="M860 392H1100" stroke="#3a2218" stroke-width="1.5"/>
<text x="860" y="410" font-family="Consolas,Menlo,monospace" font-size="11" letter-spacing="2" fill="#8a5a36">SIGNED</text>
<g clip-path="url(#sig)"><text x="870" y="385" font-family="'Brush Script MT','Segoe Script','Lucida Handwriting',cursive" font-size="44" fill="#3a2218">PιɳC</text></g>
<g class="seal">
<circle cx="970" cy="175" r="52" fill="#8e1f1f"/>
<path d="M918 170q-8 14 4 26M1020 160q10 16 -2 30M960 124q14 -6 24 2" stroke="#8e1f1f" stroke-width="10" stroke-linecap="round" fill="none"/>
<circle cx="970" cy="175" r="38" fill="none" stroke="#5e1212" stroke-width="2"/>
<text x="970" y="193" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="48" fill="#c94a3a">♠</text>
<text x="970" y="256" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="12" letter-spacing="2" fill="#8e1f1f">DO NOT COPY THE ART</text>
</g>
</svg>
